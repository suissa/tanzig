name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'test/**'
      - '!test/e2e/**'
      - 'pkg/adapters/**'
      - 'pkg/tree-sitter-zx/**'
      - 'pkg/tree-sitter-mdzx/**'
      - 'vendor/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'test/**'
      - '!test/e2e/**'
      - 'pkg/adapters/**'
      - 'pkg/tree-sitter-zx/**'
      - 'pkg/tree-sitter-mdzx/**'
      - 'vendor/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 0
      - name: Build project
        run: zig build
      - name: Verify executable
        run: ./zig-out/bin/zx --help || echo "Executable built successfully"
        shell: bash

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 0
      - name: Run tests
        run: |
          zig build test
          zig test src/ai/utils.zig
          zig test src/ai/tool_runner.zig
        env:
          E2E: 1

  ai-utils-zig-016:
    name: AI Utils (Zig 0.16.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-size-limit: 0
      - name: Test standalone AI utilities
        run: zig test src/ai/utils.zig
